[project]
name = "ckad-prep"
version = "0.1.0"
description = "CKAD exam preparator - practice on kind"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
ckad = "ckad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/ckad/exercises/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/ckad"]

[dependency-groups]
dev = [
    "ruff>=0.4",
]
