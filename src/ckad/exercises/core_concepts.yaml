- id: core_concepts-15
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create a busybox pod that echoes 'hello world' and then exits
  task: Create a busybox pod that echoes 'hello world' and then exits
  hints: []
  solution:
  - kubectl run busybox --image=busybox -it --restart=Never -- echo 'hello world'
  - kubectl run busybox --image=busybox -it --restart=Never -- /bin/sh -c 'echo hello
