- id: core_concepts-08
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Change pod's image to nginx:1.24.0. Observe that the container will be restarted
    as soon as the image gets pulled
  task: Change pod's image to nginx:1.24.0. Observe that the container will be restarted
    as soon as the image gets pulled
  hints: []
  solution:
  - kubectl set image POD/POD_NAME CONTAINER_NAME=IMAGE_NAME:TAG
  - kubectl set image pod/nginx nginx=nginx:1.24.0
  - 'kubectl describe po nginx # you will see an event ''Container will be killed
    and recreated'''
  - 'kubectl get po nginx -w # watch it'
  - kubectl get po nginx -o jsonpath='{.spec.containers[].image}{"\n"}'
  verify:
  - 'kubectl describe po nginx # you will see an event ''Container will be killed
    and recreated'''
  - 'kubectl get po nginx -w # watch it'
  - kubectl get po nginx -o jsonpath='{.spec.containers[].image}{"\n"}'
  cleanup:
  - echo 'No cleanup needed'
- id: core_concepts-09
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Get nginx pod's ip created in previous step, use a temp busybox image to
    wget its '/'
  task: Get nginx pod's ip created in previous step, use a temp busybox image to wget
    its '/'
  hints: []
  solution:
  - 'kubectl get po -o wide # get the IP, will be something like ''10.1.1.131'''
  - kubectl run busybox --image=busybox --rm -it --restart=Never -- wget -O- 10.1.1.131:80
  - NGINX_IP=$(kubectl get pod nginx -o jsonpath='{.status.podIP}')
  - kubectl run busybox --image=busybox --env="NGINX_IP=$NGINX_IP" --rm -it --restart=Never
    -- sh -c 'wget -O- $NGINX_IP:80'
  - kubectl run busybox --image=busybox --rm -it --restart=Never -- wget -O- $(kubectl
    get pod nginx -o jsonpath='{.status.podIP}:{.spec.containers[0].ports[0].containerPort}')
  verify:
  - 'kubectl get po -o wide # get the IP, will be something like ''10.1.1.131'''
  cleanup:
  - echo 'No cleanup needed'
