- id: core_concepts-07
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create a pod with image nginx called nginx and expose traffic on port 80
  task: Create a pod with image nginx called nginx and expose traffic on port 80
  hints: []
  solution:
