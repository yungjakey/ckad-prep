- id: core_concepts-00
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create a namespace called 'mynamespace' and a pod with image nginx called
    nginx on this namespace
  task: Create a namespace called 'mynamespace' and a pod with image nginx called
    nginx on this namespace
  hints: []
  solution:
  - kubectl create namespace mynamespace
  - kubectl run nginx --image=nginx --restart=Never -n mynamespace
  verify:
  - kubectl get ns mynamespace -o name
  - kubectl get po nginx -n mynamespace -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete ns mynamespace --ignore-not-found
  - kubectl delete po nginx -n mynamespace --ignore-not-found
- id: core_concepts-01
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create the pod that was just described using YAML
  task: Create the pod that was just described using YAML
  hints: []
  solution:
  - kubectl run nginx --image=nginx --restart=Never --dry-run=client -n mynamespace
    -o yaml > pod.yaml
  - kubectl create -f pod.yaml
  - kubectl run nginx --image=nginx --restart=Never --dry-run=client -o yaml | kubectl
    create -n mynamespace -f -
  verify:
  - kubectl get po nginx -n mynamespace -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete po nginx -n mynamespace --ignore-not-found
- id: core_concepts-02
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create a busybox pod (using kubectl command) that runs the command "env".
    Run it and see the output
  task: Create a busybox pod (using kubectl command) that runs the command "env".
    Run it and see the output
  hints: []
  solution:
  - 'kubectl run busybox --image=busybox --command --restart=Never -it --rm -- env
    # -it will help in seeing the output, --rm will immediately delete the pod after
    it exits'
  - kubectl run busybox --image=busybox --command --restart=Never -- env
  - kubectl logs busybox
  verify:
  - kubectl get po busybox -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete po busybox --ignore-not-found
- id: core_concepts-03
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create a busybox pod (using YAML) that runs the command "env". Run it and
    see the output -> Get the YAML for a new namespace called 'myns' without creating
    it
  task: Create a busybox pod (using YAML) that runs the command "env". Run it and
    see the output
  hints: []
  solution:
  - kubectl run busybox --image=busybox --restart=Never --dry-run=client -o yaml --command
    -- env > envpod.yaml
  - kubectl apply -f envpod.yaml
  - kubectl logs busybox
  - '# Then: Get the YAML for a new namespace called ''myns'' without creating it'
  - kubectl create namespace myns -o yaml --dry-run=client
  verify:
  - kubectl get po busybox -o jsonpath='{.status.phase}'
  - kubectl get ns myns -o name
  cleanup:
  - kubectl delete po busybox --ignore-not-found
- id: core_concepts-05
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Create the YAML for a new ResourceQuota called 'myrq' with hard limits of
    1 CPU, 1G memory and 2 pods without creating it
  task: Create the YAML for a new ResourceQuota called 'myrq' with hard limits of
    1 CPU, 1G memory and 2 pods without creating it
  hints: []
  solution:
  - kubectl create quota myrq --hard=cpu=1,memory=1G,pods=2 --dry-run=client -o yaml
  verify:
  - echo 'Verify manually'
  cleanup:
  - kubectl delete quota myrq -n default --ignore-not-found
