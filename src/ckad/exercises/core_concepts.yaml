- id: core_concepts-16
  domain: core_concepts
  domain_name: Core Concepts
  weight: 13
  title: Do the same, but have the pod deleted automatically when it's completed ->
    Create an nginx pod and set an env value as 'var1=val1'. Check the env value existence
    within the pod
  task: Do the same, but have the pod deleted automatically when it's completed
  hints: []
  solution:
  - kubectl run busybox --image=busybox -it --rm --restart=Never -- /bin/sh -c 'echo
    hello world'
  - 'kubectl get po # nowhere to be found :)'
  - '# Then: Create an nginx pod and set an env value as ''var1=val1''. Check the
    env value existence within the pod'
  - kubectl run nginx --image=nginx --restart=Never --env=var1=val1
  - kubectl exec -it nginx -- env
  - kubectl exec -it nginx -- sh -c 'echo $var1'
  - kubectl describe po nginx | grep val1
  - kubectl run nginx --restart=Never --image=nginx --env=var1=val1 -it --rm -- env
  - kubectl run nginx --image nginx --restart=Never --env=var1=val1 -it --rm -- sh
    -c 'echo $var1'
  verify:
  - 'kubectl get po # nowhere to be found :)'
  - kubectl get po nginx -o jsonpath='{.status.phase}'
  - kubectl describe po nginx | grep val1
  cleanup:
  - echo 'No cleanup needed'
