- id: configuration-18
  domain: configuration
  domain_name: Configuration
  weight: 18
  title: Create a secret called mysecret2 that gets key/value from a file -> Get the
    value of mysecret2
  task: Create a secret called mysecret2 that gets key/value from a file
  hints: []
  solution:
  - kubectl create secret generic mysecret2 --from-file=username
  - '# Then: Get the value of mysecret2'
  - kubectl get secret mysecret2 -o yaml
  - 'echo -n YWRtaW4= | base64 -d # on MAC it is -D, which decodes the value and shows
    ''admin'''
  - kubectl get secret mysecret2 -o jsonpath='{.data.username}' | base64 -d
  - kubectl get secret mysecret2 --template '{{.data.username}}' | base64 -d
  - kubectl get secret mysecret2 -o json | jq -r .data.username | base64 -d
  verify:
  - kubectl get secret mysecret2 -o jsonpath='{.data}'
  - kubectl get secret mysecret2 -o yaml
  - kubectl get secret mysecret2 -o jsonpath='{.data.username}' | base64 -d
  - kubectl get secret mysecret2 --template '{{.data.username}}' | base64 -d
  - kubectl get secret mysecret2 -o json | jq -r .data.username | base64 -d
  cleanup:
  - kubectl delete secret mysecret2 --ignore-not-found
- id: configuration-20
  domain: configuration
  domain_name: Configuration
  weight: 18
  title: Create an nginx pod that mounts the secret mysecret2 in a volume on path
    /etc/foo -> Delete the pod you just created and mount the variable 'username'
    from secret mysecret2 onto a new nginx pod in env variable called 'USERNAME'
  task: Create an nginx pod that mounts the secret mysecret2 in a volume on path /etc/foo
  hints: []
  solution:
  - kubectl run nginx --image=nginx --restart=Never -o yaml --dry-run=client > pod.yaml
  - kubectl create -f pod.yaml
  - kubectl exec -it nginx -- /bin/bash
  - ls /etc/foo
  - 'cat /etc/foo/username # shows admin'
  - '# Then: Delete the pod you just created and mount the variable ''username'' from
    secret mysecret2 onto a new nginx pod in env variable called ''USERNAME'''
  - kubectl delete po nginx
  - kubectl run nginx --image=nginx --restart=Never -o yaml --dry-run=client > pod.yaml
  - kubectl create -f pod.yaml
  - 'kubectl exec -it nginx -- env | grep USERNAME | cut -d ''='' -f 2 # will show
    ''admin'''
  verify:
  - kubectl get po nginx -o jsonpath='{.status.phase}'
  - kubectl get po nginx -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete po nginx --ignore-not-found
