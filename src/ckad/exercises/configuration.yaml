- id: configuration-00
  domain: configuration
  domain_name: Configuration
  weight: 18
  title: Create a configmap named config with values foo=lala,foo2=lolo -> Display
    its values
  task: Create a configmap named config with values foo=lala,foo2=lolo
  hints: []
  solution:
  - kubectl create configmap config --from-literal=foo=lala --from-literal=foo2=lolo
  - '# Then: Display its values'
  - kubectl get cm config -o yaml
  - kubectl describe cm config
  verify:
  - kubectl get cm config -o jsonpath='{.data}'
  - kubectl get cm config -o yaml
  - kubectl describe cm config
  cleanup:
  - kubectl delete cm config --ignore-not-found
