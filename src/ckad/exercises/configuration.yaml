  - kubectl get cm cmvolume -o jsonpath='{.data}'
  - kubectl get po nginx -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete cm cmvolume --ignore-not-found
  - kubectl delete po nginx --ignore-not-found
