- id: configuration-07
  domain: configuration
  domain_name: Configuration
  weight: 18
  title: Create a configMap 'cmvolume' with values 'var8=val8', 'var9=val9'. Load
    this as a volume inside an nginx pod on path '/etc/lala'. Create the pod and 'ls'
    into the '/etc/lala' directory.
  task: Create a configMap 'cmvolume' with values 'var8=val8', 'var9=val9'. Load this
    as a volume inside an nginx pod on path '/etc/lala'. Create the pod and 'ls' into
    the '/etc/lala' directory.
  hints:
  - 'Configure a Security Context for a Pod or Container: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/'
  solution:
  - kubectl create configmap cmvolume --from-literal=var8=val8 --from-literal=var9=val9
