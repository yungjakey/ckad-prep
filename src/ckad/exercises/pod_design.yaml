- id: pod_design-17
  domain: pod_design
  domain_name: Pod Design
  weight: 20
  title: Create a deployment with image nginx:1.18.0, called nginx, having 2 replicas,
    defining port 80 as the port that this container exposes (don't create a service
    for this deployment) -> View the YAML of this deployment -> View the YAML of the
    replica set that was created by this deployment -> Get the YAML for one of the
    pods
  task: Create a deployment with image nginx:1.18.0, called nginx, having 2 replicas,
    defining port 80 as the port that this container exposes (don't create a service
    for this deployment)
  hints: []
  solution:
  - kubectl create deployment nginx  --image=nginx:1.18.0  --dry-run=client -o yaml
    > deploy.yaml
  - kubectl apply -f deploy.yaml
  - 'kubectl create deployment nginx  --image=nginx:1.18.0  --dry-run=client -o yaml
    | sed ''s/replicas: 1/replicas: 2/g''  | sed ''s/image: nginx:1.18.0/image: nginx:1.18.0\n        ports:\n        -
    containerPort: 80/g'' | kubectl apply -f -'
  - kubectl create deploy nginx --image=nginx:1.18.0 --replicas=2 --port=80
  - '# Then: View the YAML of this deployment'
  - kubectl get deploy nginx -o yaml
  - '# Then: View the YAML of the replica set that was created by this deployment'
  - 'kubectl describe deploy nginx # you''ll see the name of the replica set on the
    Events section and in the ''NewReplicaSet'' property'
  - 'kubectl get rs -l run=nginx # if you created deployment by ''run'' command'
  - 'kubectl get rs -l app=nginx # if you created deployment by ''create'' command'
  - you could also just do kubectl get rs
  - kubectl get rs nginx-7bf7478b77 -o yaml
  - '# Then: Get the YAML for one of the pods'
  - 'kubectl get po # get all the pods'
  - 'kubectl get po -l run=nginx # if you created deployment by ''run'' command'
  - 'kubectl get po -l app=nginx # if you created deployment by ''create'' command'
  - kubectl get po nginx-7bf7478b77-gjzp8 -o yaml
  verify:
  - kubectl get deploy nginx -o jsonpath='{.status.readyReplicas}'
  - kubectl get deploy nginx -o yaml
  - 'kubectl describe deploy nginx # you''ll see the name of the replica set on the
    Events section and in the ''NewReplicaSet'' property'
  - 'kubectl get rs -l run=nginx # if you created deployment by ''run'' command'
  - 'kubectl get rs -l app=nginx # if you created deployment by ''create'' command'
  - kubectl get rs nginx-7bf7478b77 -o yaml
  - 'kubectl get po # get all the pods'
  - 'kubectl get po -l run=nginx # if you created deployment by ''run'' command'
  - 'kubectl get po -l app=nginx # if you created deployment by ''create'' command'
  - kubectl get po nginx-7bf7478b77-gjzp8 -o yaml
  cleanup:
  - kubectl delete deploy nginx --ignore-not-found
