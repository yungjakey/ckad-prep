- id: pod_design-00
  domain: pod_design
  domain_name: Pod Design
  weight: 20
  title: Create 3 pods with names nginx1,nginx2,nginx3. All of them should have the
    label app=v1
  task: Create 3 pods with names nginx1,nginx2,nginx3. All of them should have the
    label app=v1
  hints: []
  solution:
  - kubectl run nginx1 --image=nginx --restart=Never --labels=app=v1
  - kubectl run nginx2 --image=nginx --restart=Never --labels=app=v1
  - kubectl run nginx3 --image=nginx --restart=Never --labels=app=v1
  - for i in `seq 1 3`; do kubectl run nginx$i --image=nginx -l app=v1 ; done
  verify:
  - kubectl get po nginx1 -o jsonpath='{.status.phase}'
  - kubectl get po nginx2 -o jsonpath='{.status.phase}'
  - kubectl get po nginx3 -o jsonpath='{.status.phase}'
  - kubectl get po nginx$i -o jsonpath='{.status.phase}'
  cleanup:
  - kubectl delete po nginx1 --ignore-not-found
  - kubectl delete po nginx2 --ignore-not-found
  - kubectl delete po nginx3 --ignore-not-found
  - kubectl delete po nginx$i --ignore-not-found
